# ============================================================================
# 入口网关（容器内路径 /etc/nginx/conf.d/default.conf）
# 由 docker-compose.yml 挂载；upstream 直接用 compose 服务名，靠 Docker DNS 解析。
#
# 路由约定：
#   /api/**  → api:8000   （后端路由前缀本身就是 /api/v1，不做 rewrite，避免丢前缀）
#   /h5/**   → h5:80      （proxy_pass 末尾带 /，削掉 /h5 前缀；因为 H5 构建 base=/h5/，
#                          只对静态资源生效，浏览器地址栏仍是 /h5/...）
#   /**      → admin:80   （管理后台 base=/，含 history 路由兜底）
# ============================================================================

server {
    listen 80 default_server;
    server_name _;

    # 单张图片上限 5MB（UPLOAD_MAX_BYTES），留一倍余量
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # ------------------------------------------------------------ 后端 API
    # 流式问答（SSE）：必须关缓冲，否则 nginx 会把逐字输出攒成一整段才下发。
    # 后端同时回了 X-Accel-Buffering: no，这里显式写一遍，两边的意图不依赖单一开关。
    location = /api/v1/agent/staff/chat/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # 首字之前要等模型，之后 token 连续到达；比普通接口放宽一些
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # 健康检查：curl -i http://120.53.13.162/healthz
    location = /healthz {
        proxy_pass http://api:8000/healthz;
        access_log off;
    }

    # /api 本身不是有效接口（后端前缀是 /api/v1），直接 404，避免落到后台静态站返回 200 HTML
    location = /api {
        return 404;
    }

    # 接口文档：对公网暴露 schema 有信息泄露风险，默认关闭。
    # 需要时在服务器上用 `curl 127.0.0.1:8000/docs` 或临时打开下面两行。
    # location /docs        { proxy_pass http://api:8000; }
    # location /openapi.json { proxy_pass http://api:8000; }

    # ------------------------------------------------------------ H5（base=/h5/）
    location = /h5 {
        return 301 /h5/;
    }

    location /h5/ {
        proxy_pass http://h5:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------ 管理后台（根路径）
    location / {
        proxy_pass http://admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 访问日志保留：排查 4xx/5xx 路由问题的主要依据
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
