server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    # 构建 base=/h5/：产物里的资源路径是 /h5/assets/...，
    # 入口网关会削掉 /h5 前缀再转发到本容器，所以这里仍按站点根目录托管。
    # 带 hash 的构建产物可长缓存（只写一条 Cache-Control，避免 expires 与 add_header 产生重复头）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history 路由兜底（/h5/orders/12 等深链刷新不 404）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
