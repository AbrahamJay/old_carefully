# ============================================================================
# 社区养老服务平台 · 生产编排
#
# 拓扑：
#   nginx(80) ──┬─ /api/  ─→ api:8000      (FastAPI)
#               ├─ /h5/   ─→ h5:80         (Vue3 静态站，构建 base=/h5/)
#               └─ /      ─→ admin:80      (Vue3 静态站，构建 base=/)
#
#   api ─→ postgres:5432   (pgvector/pgvector:pg16)
#   api ─→ minio:9000      (对象存储，图片 302 直链)
#
# 用法：
#   1) cp .env.example .env && vim .env
#   2) 自带 PG/MinIO（空服务器）：
#        docker compose --profile infra up -d --build
#   3) 复用已有 PG/MinIO 容器（本服务器现状）：
#        docker network create socialoldcare-net          # 若不存在，先创建
#        docker network connect --alias postgres socialoldcare-net <pg容器名>
#        docker network connect --alias minio    socialoldcare-net <minio容器名>
#        docker compose up -d --build                     # 不带 infra，避免端口/数据冲突
#   4) 首次部署后导入基础数据 + 建管理员，见 docs/部署文档.md
# ============================================================================
name: socialoldcare

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------- 基础设施
  # 仅在 --profile infra 下启动；已有 PG 时不要加这个 profile
  postgres:
    image: pgvector/pgvector:pg16
    container_name: socialoldcare-pg
    profiles: ["infra"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socialoldcare}
      POSTGRES_USER: ${POSTGRES_USER:-socialoldcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 只绑回环：本机可 psql/SSH 隧道，公网不可直连
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socialoldcare} -d ${POSTGRES_DB:-socialoldcare}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    logging: *default-logging

  # 仅在 --profile infra 下启动；已有 MinIO 时不要加这个 profile
  minio:
    image: minio/minio:latest
    container_name: socialoldcare-minio
    profiles: ["infra"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      TZ: Asia/Shanghai
    volumes:
      - miniodata:/data
    ports:
      # 9000 必须可被浏览器访问（图片直链）；控制台只绑回环，用 SSH 隧道看
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [backend]
    logging: *default-logging

  # ---------------------------------------------------------------- 后端
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: socialoldcare/api:0.2.0
    container_name: socialoldcare-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 数据库连接串在这里拼，避免 .env 里密码写两遍（密码必须是 URL 安全字符）
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-socialoldcare}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-socialoldcare}
      APP_ENV: ${APP_ENV:-prod}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      ALLOW_DEMO_LOGIN: ${ALLOW_DEMO_LOGIN:-false}
      AUTO_SEED: ${AUTO_SEED:-false}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://120.53.13.162}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-socialoldcare-media}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://120.53.13.162:9000/socialoldcare-media}
      FILE_DELIVERY: ${FILE_DELIVERY:-redirect}
      REQUIRE_FILE_AUTH: ${REQUIRE_FILE_AUTH:-false}
      UPLOAD_DIR: /app/uploads
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Shanghai}
      TZ: Asia/Shanghai
    volumes:
      # 仅 STORAGE_PROVIDER=local 时才会用到；切回本地存储不丢历史图片
      - api-uploads:/app/uploads
    ports:
      # 只绑回环，便于服务器上 curl 排查；公网流量一律走 nginx
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [backend]
    logging: *default-logging

  # ---------------------------------------------------------------- 前端静态站
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    image: socialoldcare/admin:0.2.0
    container_name: socialoldcare-admin
    restart: unless-stopped
    expose:
      - "80"
    networks: [backend]
    logging: *default-logging

  h5:
    build:
      context: ./apps/h5
      dockerfile: Dockerfile
    image: socialoldcare/h5:0.2.0
    container_name: socialoldcare-h5
    restart: unless-stopped
    expose:
      - "80"
    networks: [backend]
    logging: *default-logging

  # ---------------------------------------------------------------- 入口网关
  nginx:
    image: nginx:1.27-alpine
    container_name: socialoldcare-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # 配好证书后再打开 443
      # - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - admin
      - h5
    networks: [backend]
    logging: *default-logging

networks:
  backend:
    # 必须由运维先创建（详见 docs/部署文档.md 第 3 节）：
    #   docker network create socialoldcare-net
    # 用 external 而不是让 compose 托管：复用服务器上已有的 PG/MinIO 容器时，
    # 它们要加入同一个网络；若网络由 compose 创建，compose 会校验 label 并报
    # "network ... has incorrect label" 而拒绝启动。
    external: true
    name: socialoldcare-net

volumes:
  pgdata:
  miniodata:
  api-uploads:
